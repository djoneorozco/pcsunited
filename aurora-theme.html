    <div id="pcsu-user-shell" style="all:initial;">

      <style>
    #pcsu-user-shell,
    #pcsu-user-shell *{
      box-sizing:border-box;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    #pcsu-user-shell{
      width:100%;
      display:block;
      color:#eef6ff;
      position:relative;
      overflow:hidden;
      padding:18px 14px 28px;
      --aur-bg-1:#155a73;
      --aur-bg-2:#234f87;
      --aur-bg-3:#40548d;
      --aur-bg-4:#6a5b83;
      --aur-ink:#f7fbff;
      --aur-ink-soft:rgba(247,251,255,.86);
      --aur-muted:rgba(236,244,255,.70);
      --aur-muted-2:rgba(236,244,255,.54);
      --aur-mint:#7ff4d6;
      --aur-cyan:#9ee8ff;
      --aur-blue:#73bcff;
      --aur-violet:#a490ff;
      --aur-coral:#ffab94;
      --aur-amber:#ffd18d;
      --aur-bad:#ff95aa;
      --aur-line:rgba(255,255,255,.18);
      --aur-line-soft:rgba(255,255,255,.10);
      --aur-line-faint:rgba(255,255,255,.07);
      --aur-glass:
        linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
      --aur-glass-soft:
        linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.05));
      --aur-glass-subtle:
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
      --aur-shadow:0 20px 55px rgba(9,20,36,.14);
      --aur-shadow-soft:0 10px 28px rgba(9,20,36,.10);
      --aur-wrap-shadow:0 34px 90px rgba(8,16,30,.16);
      --aur-r-xl:28px;
      --aur-r-lg:22px;
      --aur-r-md:18px;
      --aur-r-sm:14px;
      background:
        radial-gradient(980px 540px at 0% 0%, rgba(82,226,255,.26), transparent 58%),
        radial-gradient(920px 520px at 100% 0%, rgba(255,177,122,.20), transparent 48%),
        radial-gradient(760px 420px at 88% 12%, rgba(255,153,153,.12), transparent 28%),
        radial-gradient(880px 540px at 50% 100%, rgba(164,144,255,.18), transparent 54%),
        linear-gradient(135deg, #176b84 0%, #29578e 34%, #44588f 68%, #6b5c83 100%);
    }
    #pcsu-user-shell::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0) 24%),
        radial-gradient(circle at 14% 16%, rgba(255,255,255,.10), transparent 18%),
        radial-gradient(circle at 86% 10%, rgba(255,229,178,.10), transparent 16%);
      opacity:.9;
    }
    #pcsu-user-shell::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size:100% 48px, 48px 100%;
      mask-image:linear-gradient(180deg, rgba(0,0,0,.22), transparent 74%);
      opacity:.18;
    }
    .pcsu-wrap{
      width:min(1420px,100%);
      margin:0 auto;
      position:relative;
      z-index:2;
    }
    /* ============================================================
       TOPBAR / GREETING
    ============================================================ */
    .pcsu-topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin-bottom:18px;
      padding:18px 18px 16px;
      border-radius:30px;
      border:1px solid rgba(255,255,255,.22);
      background:
        radial-gradient(520px 220px at 0% 0%, rgba(97,232,255,.14), transparent 72%),
        radial-gradient(360px 200px at 100% 0%, rgba(255,185,132,.11), transparent 68%),

      box-shadow:var(--aur-wrap-shadow);

      text-transform:uppercase;

    .pcsu-title{
      margin:0;

      font-family:"Inter",system-ui,sans-serif;
      font-size:clamp(28px, 4vw, 52px);
      line-height:1.02;
      font-weight:900;
      letter-spacing:-.05em;
      text-shadow:0 2px 16px rgba(26,48,86,.10);

      line-height:1.62;

        rgba(255,255,255,.02);
      box-shadow:var(--aur-shadow-soft);
      backdrop-filter:blur(12px) saturate(128%);
      -webkit-backdrop-filter:blur(12px) saturate(128%);

    }
    .pcsu-brand-mark{

    .pcsu-avatar::after{
      content:"";
      position:absolute;

    /* ============================================================
       MAIN LAYOUT
    ============================================================ */
    .pcsu-grid{

    ============================================================ */
    .pcsu-card{
      position:relative;
      min-width:0;

      border-radius:var(--aur-r-xl);

        radial-gradient(360px 200px at 100% 0%, rgba(255,177,122,.09), transparent 68%),
        var(--aur-glass-soft);
