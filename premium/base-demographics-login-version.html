            <script>
    (function () {
      "use strict";
      function initHeaderCompStrip() {
        const root = document.getElementById("pcsu-header-comp-api");
        if (!root) return;
        if (root.dataset.mounted === "true") return;
        root.dataset.mounted = "true";
        const els = {
          basic: root.querySelector("#header-api-basic"),
          bas: root.querySelector("#header-api-bas"),
          bah: root.querySelector("#header-api-bah"),
          total: root.querySelector("#header-api-total"),
          foot: root.querySelector("#header-api-foot")
        };
        const tiles = Array.from(root.querySelectorAll(".pcsu-header-comp-tile"));
        if (!els.basic || !els.bas || !els.bah || !els.total) {
          console.warn("PCSU header comp strip: missing required DOM elements.");
          return;
        }
        // ============================================================
        // #1) STORAGE KEYS
        // ============================================================
        const PROFILE_KEY = "pcsunited.profile.v1";
        const ID_KEY = "pcsunited.identity.v1";
        const BRIDGE_KEY = "pcsunited.bridge.v1";
        const LEGACY_BRIDGE_KEY = "realtysass.bridge";
        const BASELINE_KEY = "pcsunited.baseline.v1";
        const SELECTED_BASE_KEY = "pcsunited.selectedBase.v1";
        const SELECTED_JSON_URL_KEY = "pcsunited.selectedCityJsonUrl.v1";
        const API_BASE = "https://thewing.netlify.app/api";
        const OPEN_SOURCE_ENDPOINT = API_BASE + "/opensource-brain";
        const PAY_TABLES_ENDPOINT = API_BASE + "/pay-tables";
        let requestSeq = 0;
        const cityJsonCache = new Map();
        // ============================================================
        // #2) UI HELPERS
        // ============================================================
        function setLoading(isLoading) {
          tiles.forEach(function(tile){
            tile.classList.toggle("is-loading", !!isLoading);
          });
        }
        function setMissing(isMissing) {
          tiles.forEach(function(tile){
            tile.classList.toggle("is-missing", !!isMissing);
          });
        }
        function setFoot(text, visible) {
          if (!els.foot) return;
          els.foot.textContent = text || "";
          els.foot.classList.toggle("is-visible", !!visible);
        }
        function money(n) {
          return "$" + Number(n || 0).toLocaleString("en-US", {
            maximumFractionDigits: 0
          });
        }
        function num(value, fallback) {
          if (fallback === undefined) fallback = 0;
          const n = Number(String(value ?? "").replace(/[$,]/g, ""));
          return Number.isFinite(n) ? n : fallback;
        }
        function cleanString(value) {
          return value === undefined || value === null ? "" : String(value).trim();
        }
        function safeJsonParse(raw, fallback) {
          try {
            return raw ? JSON.parse(raw) : fallback;
          } catch (_e) {
            return fallback;
          }
        }
        function readJsonStorage(key, fallback) {
          try {
            const localRaw = localStorage.getItem(key);
            if (localRaw) return safeJsonParse(localRaw, fallback);
            const sessionRaw = sessionStorage.getItem(key);
            if (sessionRaw) return safeJsonParse(sessionRaw, fallback);
            return fallback;
          } catch (_e) {
            return fallback;
          }
        }
        function readTextStorage(key, fallback) {
          try {
            return (
              localStorage.getItem(key) ||
              sessionStorage.getItem(key) ||
              fallback ||
              ""
            );
          } catch (_e) {
            return fallback || "";
          }
        }
        function cleanZip(value) {
          const match = String(value || "").match(/\b\d{5}\b/);
          return match ? match[0] : "";
        }
        function normalizeRank(value) {
          const raw = cleanString(value).toUpperCase();
          if (!raw) return "";
          const compact = raw.replace(/\s+/g, "").replace("–", "-").replace("—", "-");
          if (/^[EOW]-\d{1,2}$/.test(compact)) return compact;
          if (/^[EOW]\d{1,2}$/.test(compact)) {
            return compact.charAt(0) + "-" + compact.slice(1);
          }
          return compact;
        }
        function normalizeMode(value) {
          const raw = cleanString(value).toLowerCase();
          if (
            raw === "ad" ||
            raw === "active" ||
            raw === "active_duty" ||
            raw === "active duty" ||
            raw === "service_member"
          ) {
            return "ACTIVE_DUTY";
          }
          if (
            raw === "vet" ||
            raw === "veteran" ||
            raw === "retired" ||
            raw === "retiree"
          ) {
            return "VETERAN";
          }
          return raw ? raw.toUpperCase() : "ACTIVE_DUTY";
        }
        function isVeteranProfile(profile) {
          return normalizeMode(profile && profile.mode) === "VETERAN";
        }
        // ============================================================
        // #3) PROFILE READERS
        // ============================================================
        function readSelectedBase() {
          return readJsonStorage(SELECTED_BASE_KEY, null);
        }
        function readSelectedJsonUrl(selectedBase) {
          return (
            selectedBase?.jsonUrl ||
            selectedBase?.selectedCityJsonUrl ||
            selectedBase?.selected_city_json_url ||
            readTextStorage(SELECTED_JSON_URL_KEY, "") ||
            window.PCSU_SELECTED_CITY_JSON_URL ||
            window.OROZCO_CITY_JSON_URL ||
            ""
          );
        }
        function readMemberProfile() {
          const profile = readJsonStorage(PROFILE_KEY, null);
          const identity = readJsonStorage(ID_KEY, null);
          const bridge = readJsonStorage(BRIDGE_KEY, null);
          const legacyBridge = readJsonStorage(LEGACY_BRIDGE_KEY, null);
          const merged = {
            ...(legacyBridge && typeof legacyBridge === "object" ? legacyBridge : {}),
            ...(bridge && typeof bridge === "object" ? bridge : {}),
            ...(identity && typeof identity === "object" ? identity : {}),
            ...(profile && typeof profile === "object" ? profile : {})
          };
          if (!Object.keys(merged).length) return null;
          return merged;
        }
        function readBaselineProfile() {
          const raw = readJsonStorage(BASELINE_KEY, null);
          if (!raw || typeof raw !== "object") return null;
          if (raw.mode === "ad") {
            return {
              mode: "ad",
              rank: raw.rank,
              rank_paygrade: raw.rank,
              yos: raw.yos,
              family: raw.family,
              dependents: raw.dependents,
              base: raw.current_base || raw.base || "",
              current_base: raw.current_base || raw.base || "",
              current_zip: raw.current_zip || raw.zip || "",
              source: "baseline_overlay"
            };
          }
          if (raw.mode === "vet") {
            return {
              mode: "vet",
              rank: raw.last_held_rank || raw.rank,
              rank_paygrade: raw.last_held_rank || raw.rank,
              yos: raw.yos === "not_retired" ? 0 : raw.yos,
              va_disability: raw.va_disability,
              family: raw.family,
              dependents: raw.dependents,
              base: raw.current_base || raw.base || "",
              current_base: raw.current_base || raw.base || "",
              current_zip: raw.current_zip || raw.zip || "",
              source: "baseline_overlay"
            };
          }
          return raw;
        }
        function getActiveProfile() {
          return readMemberProfile() || readBaselineProfile();
        }
        function extractZipFromCityJson(data) {
          if (!data || typeof data !== "object") return "";
          return cleanZip(
            data.zip ||
            data.zip_code ||
            data.zipCode ||
            data.primary_zip ||
            data.primaryZip ||
            data.base_zip ||
            data.baseZip ||
            data.base_profile?.zip ||
            data.profile?.zip ||
            data.market?.zip ||
            data.housing_market?.zip ||
            ""
          );
        }
        function getSelectedBaseName(selectedBase, profile) {
          return cleanString(
            selectedBase?.base ||
            selectedBase?.label ||
            selectedBase?.name ||
            profile?.base ||
            profile?.pcsBase ||
            profile?.pcs_base ||
            profile?.current_base ||
            profile?.currentBase ||
            profile?.selected_base ||
            profile?.selectedBase ||
            ""
          );
        }
        async function fetchSelectedCityJson(selectedBase) {
          const jsonUrl = readSelectedJsonUrl(selectedBase);
          if (!jsonUrl) return null;
          if (cityJsonCache.has(jsonUrl)) {
            return cityJsonCache.get(jsonUrl);
          }
          try {
            const res = await fetch(jsonUrl + "?t=" + Date.now(), {
              method: "GET",
              cache: "no-store"
            });
            if (!res.ok) return null;
            const data = await res.json();
            cityJsonCache.set(jsonUrl, data);
            return data;
          } catch (_e) {
            return null;
          }
        }
        function resolveRank(profile) {
          return normalizeRank(
            profile?.rank_paygrade ||
            profile?.rankPaygrade ||
            profile?.rank ||
            profile?.paygrade ||
            profile?.last_held_rank ||
            profile?.lastHeldRank ||
            ""
          );
        }
        function resolveYos(profile) {
          const raw =
            profile?.yos ??
            profile?.yearsOfService ??
            profile?.years_of_service ??
            profile?.service_years ??
            0;
          if (String(raw).toLowerCase() === "not_retired") return 0;
          return num(raw, 0);
        }
        function resolveFamilyBoolean(profile) {
          if (typeof profile?.family === "boolean") return profile.family;
          if (typeof profile?.dependents === "boolean") return profile.dependents;
          const familyCount = num(
            profile?.family ??
            profile?.family_size ??
            profile?.familySize ??
            profile?.dependents_count ??
            profile?.dependentsCount,
            0
          );
          if (familyCount > 1) return true;
          const depText = cleanString(profile?.dependents).toLowerCase();
          if (["yes", "true", "with", "with_dependents", "with dependents"].includes(depText)) {
            return true;
          }
          return false;
        }
        function resolveFamilyCount(profile) {
          const n = num(
            profile?.family ??
            profile?.family_size ??
            profile?.familySize ??
            profile?.dependents_count ??
            profile?.dependentsCount,
            0
          );
          if (n > 0) return n;
          return resolveFamilyBoolean(profile) ? 2 : 1;
        }
        function resolveVaDisability(profile) {
          return num(
            profile?.va_disability ??
            profile?.vaDisability ??
            profile?.vaRating ??
            profile?.va_rating ??
            0,
            0
          );
        }
        function buildBrainInput(profile, selectedBase, cityJson) {
          const baseName = getSelectedBaseName(selectedBase, profile);
          const jsonZip = extractZipFromCityJson(cityJson);
          const zip = cleanZip(
            jsonZip ||
            profile?.bahZip ||
            profile?.bah_zip ||
            profile?.zip ||
            profile?.current_zip ||
            profile?.currentZip ||
            profile?.base_zip ||
            profile?.baseZip ||
            ""
          );
          const mode = normalizeMode(profile?.mode);
          const rank = resolveRank(profile);
          const yos = resolveYos(profile);
          const familyBool = resolveFamilyBoolean(profile);
          const familyCount = resolveFamilyCount(profile);
          const va = resolveVaDisability(profile);
          return {
            // Primary fields
            mode,
            rank,
            rank_paygrade: rank,
            rankPaygrade: rank,
            yos,
            family: familyCount,
            dependents: familyBool ? "yes" : "no",
            has_dependents: familyBool,
            hasDependents: familyBool,
            va_disability: va,
            vaDisability: va,
            vaRating: va,
            // Base / ZIP fields
            base: baseName,
            current_base: baseName,
            currentBase: baseName,
            newBase: baseName,
            selected_base: baseName,
            selectedBase: baseName,
            zip,
            bahZip: zip,
            bah_zip: zip,
            current_zip: zip,
            currentZip: zip,
            // Optional selected-base metadata
            selected_base_id: selectedBase?.id || profile?.selected_base_id || profile?.selectedBaseId || "",
            selectedBaseId: selectedBase?.id || profile?.selected_base_id || profile?.selectedBaseId || "",
            selected_base_file: selectedBase?.fileName || profile?.selected_base_file || profile?.selectedBaseFile || "",
            selectedBaseFile: selectedBase?.fileName || profile?.selected_base_file || profile?.selectedBaseFile || "",
            selected_city_json_url: readSelectedJsonUrl(selectedBase),
            selectedCityJsonUrl: readSelectedJsonUrl(selectedBase),
            // User identity
            email: profile?.email || "",
            full_name: profile?.full_name || profile?.fullName || profile?.name || "",
            fullName: profile?.fullName || profile?.full_name || profile?.name || "",
            source: "pcsunited.member.comp-strip.v2.0"
          };
        }
        // ============================================================
        // #4) PAINTERS
        // ============================================================
        function paintEmpty(message) {
          els.basic.textContent = "$0";
          els.bas.textContent = "$0";
          els.bah.textContent = "$0";
          els.total.textContent = "$0";
          setLoading(false);
          setMissing(true);
          setFoot(message || "No member compensation profile found yet.", true);
        }
        function paintComp(comp, input) {
          const basePay = num(comp.basePay, 0);
          const bas = num(comp.bas, 0);
          const bah = num(comp.bah, 0);
          const total = num(comp.total, basePay + bas + bah);
          els.basic.textContent = money(basePay);
          els.bas.textContent = money(bas);
          els.bah.textContent = money(bah);
          els.total.textContent = money(total);
          setLoading(false);
          setMissing(false);
          const rank = input?.rank || "";
          const base = input?.base || "";
          const zip = input?.zip || "";
          const context = [rank, base, zip].filter(Boolean).join(" • ");
          setFoot(context ? "Loaded from member profile: " + context : "", !!context);
        }
        // ============================================================
        // #5) RESPONSE NORMALIZERS
        // ============================================================
        function extractOpenSourceMonthly(data) {
          const payload = data?.payload || data?.data || data || {};
          const c = payload.compensation || payload.comp || payload.pay || {};
          const m = c.monthly || payload.monthly || c || {};
          const basePay =
            m.basicPay ??
            m.basePay ??
            m.base_pay ??
            m.BASEPAY ??
            m.base ??
            payload.basePay ??
            payload.base_pay ??
            0;
          const bas =
            m.bas ??
            m.BAS ??
            m.basMonthly ??
            payload.bas ??
            payload.BAS ??
            0;
          const bah =
            m.bah ??
            m.BAH ??
            m.bahMonthly ??
            payload.bah ??
            payload.BAH ??
            0;
          const total =
            m.grossMonthlyComp ??
            m.combinedMonthlyGross ??
            m.totalMonthly ??
            m.total_monthly ??
            m.total ??
            m.retiredPayGross ??
            m.vaCompensation ??
            payload.total ??
            payload.totalMonthly ??
            payload.total_monthly ??
            0;
          return {
            basePay: num(basePay, 0),
            bas: num(bas, 0),
            bah: num(bah, 0),
            total: num(total, 0)
          };
        }
        function hasAnyComp(comp) {
          if (!comp) return false;
          return !!(
            num(comp.basePay, 0) ||
            num(comp.bas, 0) ||
            num(comp.bah, 0) ||
            num(comp.total, 0)
          );
        }
        async function callOpenSourceBrain(input) {
          const requestBodies = [
            {
              tool: "PCS_SNAPSHOT",
              input
            },
            {
              type: "PCS_SNAPSHOT",
              input
            },
            input
          ];
          for (let i = 0; i < requestBodies.length; i++) {
            try {
              const res = await fetch(OPEN_SOURCE_ENDPOINT + "?t=" + Date.now(), {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                cache: "no-store",
                body: JSON.stringify(requestBodies[i])
              });
              const data = await res.json().catch(function(){ return {}; });
              if (!res.ok || data.ok === false) {
                continue;
              }
              const comp = extractOpenSourceMonthly(data);
              if (hasAnyComp(comp)) return comp;
            } catch (_err) {}
          }
          return null;
        }
        async function callPayTables(input) {
          const rank = resolveRank(input);
          const yos = resolveYos(input);
          const family = resolveFamilyBoolean(input);
          const zip = cleanZip(input?.zip || input?.bahZip || input?.bah_zip || input?.current_zip || "");
          if (!rank || !zip) return null;
          try {
            const res = await fetch(PAY_TABLES_ENDPOINT + "?t=" + Date.now(), {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              cache: "no-store",
              body: JSON.stringify({
                rank,
                yos,
                zip,
                family
              })
            });
            const data = await res.json().catch(function(){ return {}; });
            if (!res.ok || data.ok === false) {
              return null;
            }
            return {
              basePay: num(data.basePay ?? data.base_pay, 0),
              bas: num(data.bas ?? data.BAS, 0),
              bah: num(data.bah ?? data.BAH, 0),
              total: num(data.total ?? data.totalMonthly ?? data.total_monthly, 0)
            };
          } catch (_e) {
            return null;
          }
        }
        function mergeComp(openSourceComp, payTableComp) {
          const open = openSourceComp || {};
          const pay = payTableComp || {};
          const basePay =
            num(open.basePay, 0) ||
            num(pay.basePay, 0);
          const bas =
            num(open.bas, 0) ||
            num(pay.bas, 0);
          const bah =
            num(open.bah, 0) ||
            num(pay.bah, 0);
          const computedTotal = basePay + bas + bah;
          const total =
            computedTotal ||
            num(open.total, 0) ||
            num(pay.total, 0);
          return {
            basePay,
            bas,
            bah,
            total
          };
        }
        // ============================================================
        // #6) MAIN RUNNER
        // ============================================================
        async function run(reason) {
          const seq = ++requestSeq;
          const profile = getActiveProfile();
          if (!profile) {
            paintEmpty("Log in to load pay, BAS, BAH, and total monthly compensation.");
            return false;
          }
          const rank = resolveRank(profile);
          const mode = normalizeMode(profile.mode);
          if (!rank) {
            paintEmpty("Profile found, but rank/paygrade is missing.");
            return true;
          }
          try {
            setLoading(true);
            setMissing(false);
            setFoot("Loading compensation from TheWing...", true);
            const selectedBase = readSelectedBase();
            const cityJson = await fetchSelectedCityJson(selectedBase);
            const input = buildBrainInput(profile, selectedBase, cityJson);
            let openSourceComp = null;
            let payTableComp = null;
            try {
              openSourceComp = await callOpenSourceBrain(input);
            } catch (_openErr) {
              openSourceComp = null;
            }
            try {
              payTableComp = await callPayTables(input);
            } catch (_payErr) {
              payTableComp = null;
            }
            if (seq !== requestSeq) return true;
            const finalComp = mergeComp(openSourceComp, payTableComp);
            if (!hasAnyComp(finalComp)) {
              const baseLabel = input.base || "selected base";
              const zipLabel = input.zip ? " ZIP " + input.zip : "";
              paintEmpty("Unable to calculate compensation for " + rank + " at " + baseLabel + zipLabel + ".");
              return true;
            }
            // Veterans may not have BAS/BAH depending on the backend output.
            // We still paint whatever TheWing returns.
            paintComp(finalComp, input);
            return true;
          } catch (err) {
            if (seq === requestSeq) {
              paintEmpty("Compensation data could not be loaded from TheWing.");
            }
            return true;
          }
        }
        function scheduleRun(reason, delay) {
          window.clearTimeout(root.__pcsuCompTimer);
          root.__pcsuCompTimer = window.setTimeout(function () {
            run(reason);
          }, typeof delay === "number" ? delay : 120);
        }
        // ============================================================
        // #7) STARTUP + EVENTS
        // ============================================================
        run("initial");
        let attempts = 0;
        const interval = setInterval(async function () {
          attempts++;
          const done = await run("startup-poll");
          if (done || attempts > 12) clearInterval(interval);
        }, 350);
        window.addEventListener("pcsunited:logged-in", function () {
          scheduleRun("logged-in", 150);
        });
        window.addEventListener("pcsunited:profile-ready", function () {
          scheduleRun("profile-ready", 150);
        });
        window.addEventListener("pcsunited:bridge-ready", function () {
          scheduleRun("bridge-ready", 150);
        });
        window.addEventListener("pcsu:base-selected", function () {
          scheduleRun("base-selected", 150);
        });
        window.addEventListener("pcsunited:baseline-ready", function () {
          scheduleRun("baseline-ready", 150);
        });
        window.addEventListener("storage", function (event) {
          if (
            event &&
            (
              event.key === PROFILE_KEY ||
              event.key === ID_KEY ||
              event.key === BRIDGE_KEY ||
              event.key === LEGACY_BRIDGE_KEY ||
              event.key === BASELINE_KEY ||
              event.key === SELECTED_BASE_KEY ||
              event.key === SELECTED_JSON_URL_KEY
            )
          ) {
            scheduleRun("storage", 150);
          }
        });
        window.addEventListener("message", function (event) {
          const data = event && event.data;
          if (!data || typeof data !== "object") return;
          if (
            data.type === "pcsunited-bridge" ||
            data.type === "pcsunited-profile" ||
            data.source === "pcsu_base_selector" ||
            data.source === "pcsunited-login"
          ) {
            scheduleRun("message", 150);
          }
        });
        window.PCSU_HEADER_COMP = {
          run: run,
          refresh: function(){
            return run("manual-refresh");
          },
          getProfile: getActiveProfile,
          buildBrainInput: function(){
            const profile = getActiveProfile();
            const selectedBase = readSelectedBase();
            return buildBrainInput(profile || {}, selectedBase, null);
          }
        };
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initHeaderCompStrip);
      } else {
        initHeaderCompStrip();
      }
    })();
  </script>

              <script>
    (() => {

      */
      const LIVE_BASE_DEMOGRAPHICS_PATH = "/air-force/base-demographics.html";
      const REDIRECT_ON_SELECT = true;
      const BASE_FILES = [
        "Andrews.json",
        "Barksdale.json",
        "Beale.json",
        "Cannon.json",
        "Charleston.json",
        "Davis-Monthan.json",
        "Dover.json",
        "Dyess.json",
        "Eglin.json",
        "Elmendorf.json",

        "Langley.json",
        "Laughlin.json",

        "Nellis.json",
        "Offutt.json",
        "Peterson.json",
        "Randolph.json",
        "Robins.json",
        "Scott.json",
        "Seymour-Johnson.json",
        "Shaw.json",
        "Sheppard.json",
        "Tinker.json",
        "Travis.json",
        "Tyndall.json",
        "Whiteman.json",
        "Wright-Patterson.json"
      ];
      const JSON_BASE_URL =
        window.PCSU_CITIES_BASE_URL ||
        "https://raw.githubusercontent.com/djoneorozco/PCSUnited/main/netlify/functions/cities/";
      const root = document.getElementById("pcsu-base-selector");
      if (!root) return;
      const wrap = root.querySelector("#pcsuBaseWrap");
      const btn = root.querySelector("#pcsuBaseBtn");
      const valueEl = root.querySelector("#pcsuBaseValue");
      const search = root.querySelector("#pcsuBaseSearch");
      const list = root.querySelector("#pcsuBaseList");
      let activeId = null;
      let BASES = [];
      let filtered = [];
      function esc(str){
        return String(str ?? "")
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }
      function slugify(str){
        return String(str || "")
          .replace(/\.json$/i, "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");

          .replace(/\.json$/i, "")
          .split("-")
          .filter(Boolean)
          .map(part => {

          list.innerHTML = '<div class="pcsu-base-empty">No bases found.</div>';

            class="pcsu-base-item ${item.id === activeId ? "is-active" : ""}"

            data-base-id="${esc(item.id)}"

        `).join("");
      }
      function filterList(term){
        const q = String(term || "").trim().toLowerCase();

          ? [...BASES]
          : BASES.filter(item => {
              const hay = [
                item.base,
                item.fileName,
                item.id

              return hay.includes(q);
            });

      function isBaseDemographicsPage(){
        const path = String(window.location.pathname || "").toLowerCase();

        }

          Priority 2:
          If already on the Base Demographics page, stay on the exact current page/domain/path.

          Priority 3:

      filtered = [...BASES];
      btn.addEventListener("click", () => {
        if (wrap.classList.contains("is-open")) closeMenu();
        else openMenu();
      });
      document.addEventListener("click", (e) => {
        if (!root.contains(e.target)) closeMenu();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
      if (search){
        search.addEventListener("input", () => {
          filterList(search.value);
        });
      }
      if (list){
        list.addEventListener("click", (e) => {
          const itemBtn = e.target.closest("[data-base-id]");
          if (!itemBtn) return;
          const id = itemBtn.getAttribute("data-base-id");
          const match = BASES.find(x => x.id === id);
          if (!match) return;
          setActive(match, { redirect: true });
          closeMenu();
        });
      }
      const saved = loadSelection();
      const initial =
        BASES.find(x => x.id === saved?.id) ||
        BASES.find(x => x.base === "Lackland") ||
        BASES[0];
      renderList(filtered);
      setActive(initial, { redirect: false });
    })();
  </script>
