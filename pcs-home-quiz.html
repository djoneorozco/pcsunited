      <script>
    (function(){
      "use strict";
      // ============================================================
      // //#1 PCS UNITED CONFIG
      // ============================================================
      const API_BASE        = "https://pcsunited.netlify.app/api";
      const LOGIN_ENDPOINT  = API_BASE + "/login";
      const COMMIT_ENDPOINT = API_BASE + "/commit-intake";
      // ============================================================
      // //#2 PCS UNITED STORAGE KEYS
      // ============================================================
      const KEY_EMAIL   = "pcsunited.loginEmail";           // device remember
      const KEY_SESS    = "pcsunited.sessionEmail";         // tab remember
      const KEY_PUBLIC  = "pcsunited.publicDevice.v1";      // public device flag
      const KEY_PROFILE = "pcsunited.profile.v1";           // optional profile cache
      const KEY_AUTHOK  = "pcsunited.auth_ok.v1";           // set ONLY after successful password login
      // Pending queues (IMPORTANT)
      const KEY_PENDING_FAI  = "pcsunited.pending_intake.v1";      // created by FAI
      const KEY_PENDING_AIOU = "pcsunited.pending_aiou_house.v1";  // created by AIOU House Intake
      const overlay  = document.getElementById("rs-lock-overlay");
      const emailEl  = document.getElementById("rs-email-input");
      const passEl   = document.getElementById("rs-pass-input");
      const btnEl    = document.getElementById("rs-login-btn");
      const errEl    = document.getElementById("rs-lock-error");
      const pubEl    = document.getElementById("rs-public-device");
      const hudEl    = document.getElementById("rs-session-hud");
      const hudMail  = document.getElementById("rs-session-email");
      const hudOut   = document.getElementById("rs-session-logout");
      if(!overlay || !emailEl || !passEl || !btnEl) return;
      function showOverlay(){
        overlay.setAttribute("aria-hidden","false");
        try { document.documentElement.style.overflow = "hidden"; } catch(_){}
        try { document.body.style.overflow = "hidden"; } catch(_){}
      }
      function hideOverlay(){
        overlay.setAttribute("aria-hidden","true");
        try { document.documentElement.style.overflow = ""; } catch(_){}
        try { document.body.style.overflow = ""; } catch(_){}
      }
      function setError(msg){ if(errEl) errEl.textContent = msg || ""; }
      function readJSON(key, fallback){
        try{ return JSON.parse(localStorage.getItem(key) || "null") ?? fallback; }
        catch(_){ return fallback; }
      }
      function writeJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(_){ } }
      function safeRemove(key){ try{ localStorage.removeItem(key); }catch(_){ } }
      function getSavedEmail(){ try{ return (localStorage.getItem(KEY_EMAIL) || "").trim(); }catch(_){ return ""; } }
      function setSavedEmail(email){ try{ localStorage.setItem(KEY_EMAIL, (email||"").trim()); }catch(_){ } }
      function clearSavedEmail(){ try{ localStorage.removeItem(KEY_EMAIL); }catch(_){ } }
      function setSessionEmail(email){ try{ sessionStorage.setItem(KEY_SESS, (email||"").trim()); }catch(_){ } }
      function getSessionEmail(){ try{ return (sessionStorage.getItem(KEY_SESS) || "").trim(); }catch(_){ return ""; } }
      function clearSessionEmail(){ try{ sessionStorage.removeItem(KEY_SESS); }catch(_){ } }
      function setPublicFlag(on){ try{ localStorage.setItem(KEY_PUBLIC, on ? "1" : "0"); }catch(_){ } }
      function getPublicFlag(){ try{ return (localStorage.getItem(KEY_PUBLIC) || "0") === "1"; }catch(_){ return false; } }
      function showHud(email){
        if(!hudEl) return;
        if(hudMail) hudMail.textContent = email || "—";
        hudEl.style.display = "flex";
      }
      function hideHud(){
        if(!hudEl) return;
        hudEl.style.display = "none";
        if(hudMail) hudMail.textContent = "—";
      }
      function broadcastUnlocked(email){
        try{ window.dispatchEvent(new CustomEvent("pcsunited:unlocked", { detail: { email: email || "" } })); }catch(_){}
      }
      function clearDevice(){
        safeRemove(KEY_EMAIL);
        safeRemove(KEY_PROFILE);
        safeRemove(KEY_AUTHOK);
        // Intentionally NOT wiping KPI/intake keys by default
      }
      // ============================================================
      // //#3 COMMIT PENDING (AFTER PASSWORD LOGIN SUCCESS ONLY)
      // ============================================================
      async function postJSON(url, body){
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {})
        });
        const j = await r.json().catch(()=> ({}));
        if (!r.ok || j.ok === false) throw new Error(j.error || j.message || ("HTTP " + r.status));
        return j;
      }
      function getAuthOk(){
        try{
          const v = JSON.parse(localStorage.getItem(KEY_AUTHOK) || "null");
          return (v && v.email && v.ts) ? v : null;
        }catch(_){ return null; }
      }
      async function commitOne(email, key){
        const pending = readJSON(key, null);
        if (!pending || typeof pending !== "object") return null;
        const res = await postJSON(COMMIT_ENDPOINT, { email, pending });
        // Clear ONLY this pending key on success (prevents double writes)
        safeRemove(key);
        // Optional: cache profile if returned
        if (res && res.profile){
          try{ localStorage.setItem(KEY_PROFILE, JSON.stringify(res.profile)); }catch(_){}
        }
        return res;
      }
      async function commitPendingIfAny(email){
        const auth = getAuthOk();
        if (!auth || String(auth.email||"").toLowerCase() !== String(email||"").toLowerCase()){
          // Not a confirmed password login for this email; do not commit.
          return;
        }
        // Commit FAI pending first, then AIOU pending (both use same endpoint format)
        try{
          await commitOne(email, KEY_PENDING_FAI);
          await commitOne(email, KEY_PENDING_AIOU);
        }catch(e){
          console.error("commit-intake failed:", e);
          // Do NOT block the user; keep pending key(s) so it can retry next login
          setError("Login succeeded, but we couldn’t save your intake to the cloud yet. Please try again in a moment.");
        }
      }
      // ============================================================
      // //#4 UI INIT
      // ============================================================
      const savedEmail = getSavedEmail();
      const sessEmail  = getSessionEmail();
      const initialEmail = savedEmail || sessEmail;
      if(initialEmail && !emailEl.value) emailEl.value = initialEmail;
      const rememberedPublic = getPublicFlag();
      const publicDefault = !savedEmail;
      if (pubEl) pubEl.checked = (rememberedPublic ? true : publicDefault);
      if (pubEl) pubEl.addEventListener("change", ()=> setPublicFlag(!!pubEl.checked));
      // UX unlock if remembered, but commit only if auth_ok exists
      if (savedEmail || sessEmail){
        const activeEmail = savedEmail || sessEmail;
        hideOverlay();
        setSessionEmail(activeEmail);
        showHud(activeEmail);
        broadcastUnlocked(activeEmail);
        commitPendingIfAny(activeEmail);
      } else {
        showOverlay();
      }
      window.addEventListener("beforeunload", ()=>{
        try{
          if (getPublicFlag()){
            clearDevice();
            clearSavedEmail();
            clearSessionEmail();
          }
        }catch(_){}
      });
      if (hudOut){
        hudOut.addEventListener("click", ()=>{
          setError("");
          clearDevice();
          clearSavedEmail();
          setPublicFlag(true);
          clearSessionEmail();
          hideHud();
          showOverlay();
          try{ passEl.value = ""; }catch(_){}
          try{ emailEl.value = ""; }catch(_){}
          try{ if(pubEl) pubEl.checked = true; }catch(_){}
        });
      }
      // ============================================================
      // //#5 LOGIN FLOW
      // ============================================================
      async function doLogin(){
        setError("");
        const email = (emailEl.value || "").trim().toLowerCase();
        const password = (passEl.value || "").trim();
        if(!email || !password){
          setError("Please enter your email and password.");
          return;
        }
        btnEl.disabled = true;
        btnEl.textContent = "Logging in…";
        try{
          const data = await postJSON(LOGIN_ENDPOINT, { email, password });
          // Confirmed auth marker (this is what allows commits)
          writeJSON(KEY_AUTHOK, { email, ts: Date.now() });
          // Always set tab session
          setSessionEmail(email);
          const isPublicDevice = !!(pubEl && pubEl.checked);
          setPublicFlag(isPublicDevice);
          if (!isPublicDevice) setSavedEmail(email);
          else clearSavedEmail();
          // Optional profile cache
          if (data.profile){
            try{ localStorage.setItem(KEY_PROFILE, JSON.stringify(data.profile)); }catch(_){}
          }
          // Unlock UI
          hideOverlay();
          showHud(email);
          broadcastUnlocked(email);
          // ✅ Commit BOTH FAI + AIOU pending AFTER password login
          await commitPendingIfAny(email);
        }catch(e){
          setError(e.message || "Login failed.");
        }finally{
          btnEl.disabled = false;
          btnEl.textContent = "Log In";
        }
      }
      btnEl.addEventListener("click", doLogin);
      passEl.addEventListener("keydown", (e)=>{ if(e.key === "Enter") doLogin(); });
      emailEl.addEventListener("keydown", (e)=>{ if(e.key === "Enter") doLogin(); });
    })();
  </script>

        const {scores,inconsistencies} = scoreAll();
        $('#kO').textContent = scores.O.toFixed(2);
        $('#kC').textContent = scores.C.toFixed(2);
        $('#kE').textContent = scores.E.toFixed(2);
        $('#kA').textContent = scores.A.toFixed(2);
        $('#kN').textContent = scores.N.toFixed(2);
        const arch=(function(s){
          const hi=v=>v>=4.0, lo=v=>v<=2.5;
          if(hi(s.O)&&hi(s.E)) return 'Visionary Host';
          if(hi(s.C)&&!hi(s.O)&&!hi(s.E)) return 'Steady Planner';
          if(hi(s.N)&&lo(s.E)) return 'Risk-Guarded Nest-Builder';
          if(hi(s.A)&&hi(s.C)) return 'Family-First Optimizer';
          if(hi(s.O)&&s.N<3.3) return 'Design-Forward Adventurer';
          return 'Balanced Explorer';
        })(scores);
        $('#archetype').textContent = `Archetype: ${arch}`;
        const mb = scoresToMBTI(scores);
        const blurb = MBTI_BUYER_GUIDE[mb.type]
          || "Personality informs your tradeoffs; we’ll size budget first, then match how you live.";
        $('#mbti').innerHTML =
          `MBTI: <b>${mb.type}</b> — ${mbtiLabel(mb.type)} ` +
          `<span style="opacity:.7">(${(mb.confidence*100).toFixed(0)}% match)</span><br>` +
          `<span style="color:var(--muted);font-weight:400;">${blurb}</span>`;
        $('#consistency').innerHTML = inconsistencies.length
          ? `<span class="flag">⚠ Consistency flags:</span> ${inconsistencies.join(', ')}`
          : `<span class="ok">✓ Responses appear consistent across rephrased items.</span>`;
        const brief = {
          version:'aiou.v3.timed',
          ts:new Date().toISOString(),
          profile:{
            firstName: $('#firstName').value.trim(),
            lastName:  $('#lastName').value.trim(),
            bedrooms:  Number($('#bedrooms').value||0),
            budgetMax: Number($('#budget').value||0),
            setting:   $('#setting').value,
            safetyPriority: Number($('#safety').value||3)
          },
          scores,
          archetype: arch,
          mbti: mb,
          psych:{
            totalItems: Q.length,
            inconsistencies
          },
          visual:{
            styleVsPriceSlider: Number(window.__STYLE_V_PRICE ?? 0)
          }
        };
        // show results card
        $('#resultsCard').classList.remove('hidden');
        // ✅ NEW: queue for cloud commit (FAI style)
        queueAiouPending(brief);
        // auto report
        sendToLLM(brief);
      }
      /* =========================================================
         //#17 CALL NETLIFY FUNCTION (AUTO REPORT IN BOX)
         ========================================================= */
      async function sendToLLM(brief){
        const ENDPOINT = (
          document.querySelector('#aiou-shell')?.dataset?.endpoint
          || 'https://theorozcorealty.netlify.app/.netlify/functions/aiou-report'
        ).trim();
        const box = $('#jsonReportBox');
        box.innerHTML = '(Generating your personalized memo…)';
        try{
          const r = await fetch(ENDPOINT,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(brief)
          });
          if(!r.ok) throw new Error('Server returned '+r.status);
          const data = await r.json();
          const html =
            data.memoHtml
            || (data.memo
                ? `<p>${String(data.memo).replace(/</g,'&lt;')}</p>`
                : '<p>No memo returned.</p>');
          box.innerHTML = html;
          if (data.hydratedProfile){
            if (!$('#firstName').value && data.hydratedProfile.firstName){
              $('#firstName').value = data.hydratedProfile.firstName;
            }
            if (!$('#lastName').value && data.hydratedProfile.lastName){
              $('#lastName').value = data.hydratedProfile.lastName;
            }
          }
        }catch(e){
          box.innerHTML = `<span class="flag">Error: ${e.message}</span>`;
        }
      }
      /* =========================================================
         //#18 BUTTON HANDLERS
         ========================================================= */
      $('#startQuiz').addEventListener('click', startQuizFlow);
      $('#skip').addEventListener('click', ()=>{ recordAnswer(null); });
      $('#reset').addEventListener('click', ()=>{
        if (overallTimer) clearInterval(overallTimer);
        startQuizFlow();
      });
      $('#closePortal').addEventListener('click', ()=>{
        if (overallTimer) clearInterval(overallTimer);
        portal.remove();
      });
      $('#quizCard').classList.add('hidden');
      $('#resultsCard').classList.add('hidden');
    })();
  </script>
