        <script>
(function(){
  "use strict";
  const API_BASE = "https://theorozcorealty.netlify.app/api";
  // Which pages should be locked
  const ALLOW_PATHS = [
    /\/realtysass(?:\.html)?$/i,
  ];
  const path = (location.pathname || "/").toLowerCase();
  const shouldLock = ALLOW_PATHS.some(re => re.test(path));
  if (!shouldLock){
    document.querySelectorAll('#rs-lock-overlay').forEach(el => el.remove());
    return;
  }
  const overlay  = document.getElementById('rs-lock-overlay');
  const msg      = document.getElementById('rs-lock-msg');
  const emailInp = document.getElementById('rs-email-input');
  const passInp  = document.getElementById('rs-pass-input');
  const loginBtn = document.getElementById('rs-login-btn');
  const card     = document.getElementById('rs-lock-card');
  // Show overlay
  overlay.classList.remove('rs-hidden');
  overlay.style.visibility = 'visible';
  overlay.style.opacity = '1';
  // ARIA fix
  overlay.removeAttribute("aria-hidden");
  function showMsg(text, isError){
    msg.textContent = text || '';
    msg.style.color = isError ? '#ffb3b3' : 'var(--rs-muted)';
  }
  function unlock(){
    document.querySelectorAll('#rs-lock-overlay').forEach(el=>{
      el.classList.add('rs-hidden');
      el.style.visibility = 'hidden';
      el.style.opacity = '0';
      el.setAttribute("aria-hidden","true");
    });
  }
  async function loginWithServer(email, password){
    const res = await fetch(`${API_BASE}/login`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false){
      throw new Error(data.error || "Incorrect email or password.");
    }
    return data;
  }
  // NEW: remember who just logged in (for dashboards)
  function rememberLogin(email, serverData){
    try{
      // core key the dashboards can read
      localStorage.setItem("realtysass.loginEmail", email);
      // optional identity blob
      const existing = JSON.parse(localStorage.getItem("realtysass.identity") || "{}") || {};
      existing.email = email;
      // if the API happens to send a profile, lightly merge it
      const profile = (serverData && (serverData.profile || serverData.user || {})) || {};
      if (profile.full_name && !existing.name){
        existing.name = profile.full_name;
      }
      if (profile.phone && !existing.phone){
        existing.phone = profile.phone;
      }
      if (profile.rank && !existing.rankPaygrade){
        existing.rankPaygrade = profile.rank;
      }
      if (profile.va_disability && !existing.vaDisability){
        existing.vaDisability = profile.va_disability;
      }
      if (profile.years_of_service && !existing.yearsOfService){
        existing.yearsOfService = profile.years_of_service;
      }
      if (profile.mode && !existing.mode){
        existing.mode = profile.mode;
      }
      localStorage.setItem("realtysass.identity", JSON.stringify(existing));
    }catch(e){
      // fail silently; login still works
    }
  }
  async function onLogin(){
    const em = emailInp.value.trim().toLowerCase();
    const pw = passInp.value.trim();
    if (!em){
      showMsg("Please enter your email.", true);
      return;
    }
    if (pw.length < 8){
      showMsg("Password must be at least 8 characters.", true);
      return;
    }
    loginBtn.disabled = true;
    showMsg("Checking credentials...");
    try {
      const data = await loginWithServer(em, pw);
      // NEW: store email/profile locally for the Financial Dashboard
      rememberLogin(em, data);
      showMsg("");
      unlock();
    } catch (err){
      showMsg(err.message || "Incorrect email or password.", true);
      if(card && card.animate){
        card.animate(
          [
            { transform:'translateX(-5px)' },
            { transform:'translateX(5px)' },
            { transform:'translateX(0)' }
          ],
          { duration:260 }
        );
      }
    } finally {
      loginBtn.disabled = false;
    }
  }
  loginBtn.addEventListener("click", onLogin);
  passInp.addEventListener("keydown", e=>{
    if (e.key === "Enter") onLogin();
  });
  setTimeout(()=> emailInp.focus(), 0);
})();
</script>
